services:
  postgres:
    image: postgres:15-alpine
    container_name: encounter-postgres
    environment:
      POSTGRES_DB: encounters
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./apps/backend
    container_name: encounter-backend
    environment:
      PORT: 8080
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/encounters
      DB_SSL: "false"
      # HEP-SEC-001: /api always requires a verified Cognito M2M token. The
      # placeholders let the API start locally but no token can ever verify
      # against them (fail-closed). Set real values in .env to call /api.
      AUTH_COGNITO_USER_POOL_ID: ${AUTH_COGNITO_USER_POOL_ID:-us-east-1_LocalPlaceholder}
      AUTH_M2M_CLIENT_IDS: ${AUTH_M2M_CLIENT_IDS:-local-placeholder-client}
      AUTH_READ_SCOPE: ${AUTH_READ_SCOPE:-encounters/read}
      AUTH_WRITE_SCOPE: ${AUTH_WRITE_SCOPE:-encounters/write}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      args:
        # The browser is not an API client (HEP-SEC-001): the local UI is the
        # synthetic in-memory demo, bound to loopback only.
        REACT_APP_DEMO_MODE: "true"
    container_name: encounter-frontend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  pgdata:
