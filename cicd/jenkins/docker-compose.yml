services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-encounter-ci
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?JENKINS_ADMIN_PASSWORD is required}
      - JENKINS_URL=${JENKINS_URL:?JENKINS_URL is required}
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required}"

  test-db:
    image: postgres:15-alpine
    container_name: jenkins-test-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: encounter_test
    ports:
      - "5433:5432"

volumes:
  jenkins_home:
