services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-encounter-ci
    restart: unless-stopped
    # Host networking means no extra network hop, so Jenkins reaches the
    # instance role with the IMDSv2 hop limit left at 1. Containers on the
    # bridge network (test-db, build steps, anything started via the Docker
    # socket) stay one hop away and cannot get the role's credentials.
    # Ports are not published in this mode: Jenkins listens on the host's
    # 8080/50000 directly, and the EC2 security group is the only gate.
    network_mode: host
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?JENKINS_ADMIN_PASSWORD is required}
      - JENKINS_URL=${JENKINS_URL:?JENKINS_URL is required}
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required}"

  test-db:
    image: postgres:15-alpine
    container_name: jenkins-test-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: encounter_test
    # Loopback only: Jenkins (host network) reaches it at 127.0.0.1:5433;
    # nothing off the instance can.
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  jenkins_home:
